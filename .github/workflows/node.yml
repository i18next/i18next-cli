name: node

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test on node ${{ matrix.node }} and ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node: [ '24.x', '22.x' ]
        # os: [ubuntu-latest, windows-latest, macOS-latest]
        os: [ubuntu-latest, windows-latest, macOS-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # node 20/22 ship npm 10.x, whose peer resolution crashes with
      # "Cannot read properties of null (reading 'edgesOut')" on a cold install.
      # This repo has no committed lockfile, so CI always takes that path.
      # npm@11 (not @latest: npm 12 drops node 20) resolves the same tree fine.
      - run: npm install -g npm@11
      - run: npm install
      - run: npm run build
      - run: npm test